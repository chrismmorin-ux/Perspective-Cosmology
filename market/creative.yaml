# ─── Creative register (ADR-076) ────────────────────────────────────────────
# Every headline, line of copy, call to action and image brief the launch uses,
# with where it came from and who checked it. Generated by the creative-gen
# engine or written by a person; validated with the spine:
#   node kit/scripts/cwos-spine.js validate --human
# Status: draft → reviewed (a person read it) → approved (a person approved it;
# a clinician too if it makes a health claim) → live → retired. Losing variants
# stay here as evidence.

creative:
  - id: CRV-<slug>
    surface: SRF-<slug>
    element: headline          # headline | subhead | body | cta | tagline | social-post | alt-text | image-brief
    text: "<the words, or the photographer's brief>"
    embodies:                  # the expression level it carries, for every dimension that applies
      DIM-<slug>: 2
    tests: null                # HYP- it tests if it departs from the surface on one dimension
    health_claim: false        # true if it states or implies a medical fact
    generated_by: ai           # ai | human
    rationale: "<why this variant, for which persona>"
    status: draft
    reviews:
      brand: null              # date a person reviewed it
      clinician: null          # date a clinician approved a health claim
      sim: null                # SIM- or run id where personas reacted
    approved_by: null          # the human role that approved it
    experiment: null           # EXP- when live as a variant
    # image-brief only:
    # source: photographer     # photographer | stock | illustration | ai-generated (never with people)
    # people: false
