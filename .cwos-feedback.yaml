# CWOS Feedback & Friction Log
#
# GENERATED — DO NOT EDIT.
#
# The canonical store is the event log at .claude/workstream/events/, which
# holds friction_detected and feedback_recorded events. This file is a
# rendering of those events for humans, regenerated by:
#
#     node kit/scripts/cwos-feedback-view.js generate
#
# Edits here are lost on the next regeneration. To record something, use:
#
#     node kit/scripts/cwos-capture.js friction "<what fought back>" --severity high|medium|low
#     node kit/scripts/cwos-capture.js feedback "<what you said>" --category concern|preference|...
#
# WHY (WS-578). This file used to be appended to by hand: four prose
# instructions told the AI to allocate the next fr-NNN by scanning for max+1,
# append an entry, and recompute the summary block. That is a read-modify-write
# on a shared file with a derived section — the shape that lost a write on
# 2026-07-26 when two sessions shared a tree. It also drifted in practice:
# measured 2026-08-04, one repo's "auto-maintained" summary claimed 8 friction
# events against 11 real ones, and its ids ran fr-009, fr-dev-server-zombie,
# fr-reconcile-mispromote BEFORE fr-001..008, so max+1 would have collided.
#
# This file is safe to delete. It will come back on the next generate.

