# CWOS Progressive Onboarding State
# Created by /adopt. Claude reads this silently during orientation.
# The user never sees or edits this file directly.

schema_version: "3"        # Bumped from "2" by WS-250/WS-253 (ADR-035 archetype + stage + override fields). Readers tolerate v2 files (new fields default to null).
started_at: "2026-09-20T20:02:52.819Z"
repo_archetype: research-mathematical
                           # Legacy tech-stack tag — drives default scope patterns (kit/scripts/lib/archetype-patterns.js). Separate concept from `archetype` below.
# adoption_level retired (WS-438 / ADR-016): the capabilities block is canonical.
# Existing repos that still carry adoption_level are read via capability-map.js
# dual-read (resolveEnabledCapabilities); new installs no longer write it.
platform: win32
repo_goal: null            # One-sentence outcome captured by /adopt Step 3c. Read by first-touch commands to satisfy the FRS Value dimension (ADR-015).

# WS-321 — Genesis adoption phase.
# Top-level field gating dormant-mode behavior. Distinct from `milestones` map below
# (which tracks M1–M5 promotion checks). Set to "M0" by /genesis; flipped to "M1"
# by /intend after ignition completes. Default ships as M1 (preserves /adopt path —
# /adopt skips M0 entirely).
# Readers gate behavior on this field: /status renders dormant section + suppresses
# standard sections when M0; /welcome exits silently when M0; /session-start renders
# lean briefing when M0; /next refuses when M0.
# Valid: M0 | M1 | M2 | M3 | M4 | M5
adoption_phase: M1

# WS-321 — Dormant-mode block.
# Populated by /genesis at scaffold time. Read by /status (for dormant section)
# and /session-start Step 0c (intention.md edit-detection fallback).
# The three integrity flags (kit_files_installed, capture_buffer_present,
# intention_template_present) are NOT completion checks — they are integrity
# assertions. /status warns "dormant infrastructure damaged" if any goes false
# post-install. M0→M1 transition is event-driven (founder declares), not
# check-completion driven; that's why M0 is not in the milestones[] map below.
m0_dormant:
  entered_at: null               # ISO timestamp set by /genesis
  exited_at: null                # set by cwos-genesis-ignite.js apply
  exit_trigger: null             # "intend_command" | "intention_md_edit_detected" | null
  capture_buffer_path: ".claude/workstream/events/current.jsonl"
  intention_content_hash: null   # SHA-256 of intention.md non-comment content; updated by /session-start Step 0c
  kit_files_installed: false     # integrity flag — true after /genesis scaffold completes
  capture_buffer_present: false  # integrity flag — events/ dir exists with valid header
  intention_template_present: false  # integrity flag — system/intention.md is placeholder template

# ADR-035 identity archetype (NEW — WS-250).
# Drives bundle selection (kit/scripts/cwos-adopt-archetype.js) and tier defaults (kit/scripts/lib/tier-mapper.js).
# Orthogonal to `repo_archetype` above (which is the tech-stack tag); both fields coexist.
# Valid: A1 | A2 | A3 | A4 | A5 | NONE
archetype: null
declared_archetype: null   # Founder-confirmed value during /adopt Step 4b. == archetype unless founder later overrides.
detected_archetype: null   # Auto-detected from /adopt Step 3 signals. Informational; declaration is canonical.

# ADR-035 lifecycle stage (NEW — WS-250).
# Drives per-program tier defaults via kit/scripts/lib/tier-mapper.js.
# Hybrid declared+detected — WS-251 will add detection logic; this sprint only seeds the field.
# Valid: S1 | S2 | S3 | S4 | S5 | N1 | N2 | N3
stage: null
declared_stage: null       # Founder-confirmed value during /adopt Step 4c. Defaults to archetypes.yaml#archetype_entry_stages[archetype].
detected_stage: null       # Set by /audit (WS-251). Result of cwos-stage-detect.js scan; informational unless > declared.
last_recorded_stage: null  # Set by /session-end. /session-start Step 3d compares against current stage to detect cross-session transitions and surface a one-line prompt.

# Archetype declaration history (NEW — WS-252).
# Appended by /archetype re when the founder migrates between archetypes.
# Each entry archives the prior archetype declaration. Latest entry is the
# most recently archived; the active archetype is `archetype:` above.
# Schema: [{ archetype: "A5", declared_at: "...", archived_at: "...", reason: "..." }]
archetype_history: []

# Per-consequence override mechanism (NEW — WS-253, ADR-035 Stage 4 condition #2).
# Founder can opt out of archetype-derived programs or override their tier.
# Schema documented in docs/ARCHETYPES.md "Per-consequence override" section.
# Read by kit/scripts/lib/tier-mapper.js (applyProgramOptOuts + applyTierOverrides).
archetype_overrides:
  programs: []   # [{ id: "prog-X", status: "opted-out" | "opted-in", reason: "..." }] — any other status is an ERROR (WS-599)
  tiers: []      # [{ program_id: "prog-Y", override_tier: "critical|active|watch|dormant", reason: "..." }]
  # Per-AXIS override (WS-599): occupy a coordinate the archetype grid doesn't
  # name — e.g. { sensitivity: "Regulated" } on an archetype whose cell says
  # Public-no-PII. Valid axes/values: kit/data/archetypes.yaml#axes. Unknown
  # names/values are an ERROR, not a silent no-op. Works with archetype: NONE
  # too — that is the manual per-axis declaration ARCHETYPES.md describes.
  axes: {}       # { output: "...", sensitivity: "...", verification: "..." }

# Resolved bundle (NEW — WS-250). Output of cwos-adopt-archetype.js.
# Cached for /audit + /pulse readers; canonically derivable from (archetype, stage, archetype_overrides).
archetype_bundle_resolved:
  programs: []
  engines: []
  personas: []
  tiers: {}      # { "prog-X": "watch", "prog-Y": "critical", ... }
  resolved_at: null

# Claim-domain detection (written by /adopt Step 2h)
# Non-empty values trigger conditional install of prog-claims-policy + docs/claims/ templates.
# Valid entries: clinical | legal | financial | scientific
# Multi-domain repos list all detected. Empty list means no claim-domain signals detected.
repo_claims: []
# True when /adopt detected an AI-as-judge / rubric-grader / simulated-reviewer pattern.
# Triggers conditional install of docs/claims/evaluator-validation-plan.md.draft.
has_ai_evaluator: false

# Capability state (ADR-016)
# User-owned dimension that governs /next scoring and /discover surfaces.
# Five capabilities mirror kit/MANIFEST.yaml install groups.
# State enum: enabled | intended | declined | unconfigured
#   - enabled:      user accepted, setup complete   → items score normally
#   - intended:     user said yes, setup pending    → setup items boosted, staleness raises priority
#   - declined:     user said no                    → items suppressed entirely
#   - unconfigured: user not yet asked              → default scoring until /discover runs
# /adopt seeds all five as unconfigured, then flips `core` to enabled before exit.
# /discover writes captured_at and note when state moves out of unconfigured.
capabilities:
  core:
    state: enabled
    captured_at: "2026-09-20T20:02:52.819Z"
    note: null
  workstream:
    state: enabled
    captured_at: "2026-09-20T20:02:52.819Z"
    note: null
  engines:
    state: enabled
    captured_at: "2026-09-20T20:02:52.819Z"
    note: null
  governance:
    state: enabled
    captured_at: "2026-09-20T20:02:52.819Z"
    note: null
  autonomous:
    state: unconfigured
    captured_at: null
    note: null

# Deferred Installation Manifest
# Commands are grouped and installed on first use. The preamble's Progressive
# Onboarding section triggers installation when the user needs a capability.
# Each group installs its commands + any dependencies (personas, scaffolding).
deferred_commands:
  core:
    level: L1
    commands: [status, session-start, session-end, welcome, discover]
    dependencies: []
    installed: true
  workstream:
    level: L2
    commands: [next, workstream]
    dependencies:
      - directory: .claude/workstream
        scaffolding: [config.yaml, queue-index.yaml, findings-index.yaml, engines/registry.yaml, programs/registry.yaml]
        # WORKSTREAM_SUBDIRS in cwos-adopt-install.js is the authoritative
        # list; this manifest entry exists for documentation parity.
        subdirs: [queue, queue/archive, findings, findings/archive, engines, programs, enhancements, readiness, sprints, runs, evidence, governance]
      - files_from: kit/templates/system
        targets: [invariants.md, constraints.md, decisions.md, failures.md, context.md, scoring.md]
    installed: true
  engines:
    level: L3
    commands: [engine, build-engine]
    dependencies:
      # Personas (core + domain) are now tracked in kit/MANIFEST.yaml
      # and installed automatically as part of the engines group.
      - engines_from: engines/standard
      - rules_from: kit/templates/rules
    installed: true
  governance:
    level: L4
    commands: [pulse, audit]
    dependencies: []
    installed: false
  autonomous:
    level: L5
    commands: [plan, verify, decide, autopilot]
    dependencies: []
    installed: false

# Deferred Tool Installation
# Tools from docs/TOOL-CATALOG.md, assessed during /adopt Step 3b.
# Each tool has a detection trigger; /adopt populates this section based on
# which triggers matched. Tools are installed at their declared milestone.
# "repo_has_better" means the repo already built this tool more sophisticatedly
# than the CWOS template — CWOS learns from the repo instead of installing.
deferred_tools:
  # Populated by /adopt Step 3b. Example:
  # - id: T1-01
  #   name: Assumption Register
  #   milestone: m2
  #   status: pending          # pending | installed | repo_has_better | skipped
  #   template: kit/templates/system/assumptions.md
  #   repo_existing: null      # path to repo's existing version, if any
  #   notes: null              # e.g., "Migrate from constraints.md Working Assumptions"

milestones:

  m1_core_install:
    description: "Core kit installed — preamble, onboard-check, system skeleton, version stamps."
    done_looks_like: "CLAUDE.md preamble, system/state.md, .cwos-version, and fleet registration all in place."
    status: complete        # pending | in_progress | complete | skipped
    completed_at: "2026-09-20T20:02:52.819Z"
    checks:
      preamble_installed: true
      onboard_check_installed: true
      feedback_installed: true
      state_template_created: true
      gitignore_allows_system: false
      cwos_version_written: true
      fleet_registered: true

  m2_system_population:
    description: "System populated — vital signs wired to real commands, invariants and constraints captured, business context recorded."
    done_looks_like: "state.md vital signs run real commands; invariants.md, constraints.md, and context.md have real rows (no template placeholders)."
    status: pending
    completed_at: null
    checks:
      vital_signs_configured: false    # state.md has real commands, no placeholders
      vital_signs_passing: false       # at least 1 check ran successfully
      invariants_populated: false      # at least 1 real invariant (not template placeholder)
      constraints_populated: false     # at least 1 real constraint
      context_has_active_item: false   # at least 1 active business context item
      config_customized: false         # .cwos-config.yaml reviewed and adjusted by user
    # Suggestions follow understanding-first pattern:
    # [what you have] + [what the gap is] + [what this enables] + [ask]
    suggestions:
      - "Your project has tests and a build process, but right now there's no way to know when they break between sessions. Health monitoring watches for that automatically — takes about 2 minutes to set up. Want me to do it?"
      - "Your codebase has patterns and rules that should always hold — like 'never commit API keys' or 'all routes need auth.' Right now those rules live in your head. Writing them down means I can check them for you automatically. Want me to find the obvious ones?"
      - "I can be more helpful when I know what you're working toward — deadlines, customer issues, goals. Right now I'm guessing at priority. A quick context update changes that. What's top of mind for you?"
      - "Your .cwos-config.yaml controls how much structure I apply — sprint sizes, engine output detail, session ceremony. The defaults are sensible, but a quick review lets you tune CWOS to how you actually work. Want to walk through it?"

  m3_workstream_active:
    description: "Workstream active — queue holds real items, programs scoped to real file paths, user has seen programs introduced."
    done_looks_like: "queue-index.yaml has at least 3 items; at least one program's scope.file_patterns matches real files in the repo."
    status: pending
    completed_at: null
    checks:
      queue_has_items: false           # at least 3 real work items in queue/
      queue_index_valid: false         # index count matches file count
      programs_scope_valid: false      # at least 1 program's file_patterns match real files
      programs_introduced: false       # user has seen the program introduction (set by onboard-check 4c)
    suggestions:
      - "I've been finding things that could use attention — TODOs, potential bugs, improvements. But without a queue, those observations disappear between sessions. Setting up a work queue means when you ask 'what's next?', I can give you the highest-impact answer. This also enables **programs** — permanent monitors that watch key areas of your project (security, code quality, your domain logic) so nothing drifts silently. Want me to create a starter queue from what I see?"
      - "Your programs are installed but could be calibrated more precisely. I can run a quick analysis to customize each one to your specific project — verify file scopes, tailor the domain correctness program to your actual business logic, and run initial baseline checks. One-time setup, about 5 minutes. Want me to do it?"

  m4_first_engine_run:
    description: "First deep engine run complete — findings pipeline active, registry validated."
    done_looks_like: "runs/ has at least 1 RUN entry; findings/ has at least 1 FIND entry; every registered engine's skill_path points to a real file."
    status: pending
    completed_at: null
    checks:
      engine_run_completed: false      # at least 1 RUN-*.yaml exists
      findings_exist: false            # at least 1 FIND-*.yaml exists
      engine_registry_valid: false     # all registry skill_paths point to real files
    suggestions:
      - "Your system is set up and your queue is active. The next step is a deep analysis — multiple expert perspectives examine your codebase for real issues you might not see. This is where CWOS shifts from organizing your work to actively finding problems before they find you. It takes about 5 minutes and doesn't change any code. Want to try it?"
      - "I found some engine entries pointing to missing files — this means certain analyses would fail silently. Let me clean those up so everything works when you need it."

  m5_steady_state:
    description: "Steady state — every active program has been audited and session handoffs are routine."
    done_looks_like: "Every active program has last_run.date set; at least 1 session file has non-empty handoff_notes."
    status: pending
    completed_at: null
    checks:
      all_programs_audited: false      # every active program has last_run.date != null
      session_handoff_written: false   # at least 1 session with handoff notes
    suggestions:
      - "You're nearly at steady state — the point where CWOS fades into the background and just works. A few programs haven't had their first audit yet, which means there are parts of your codebase I haven't examined deeply. One quick run fills those gaps. Want me to do it?"
      - "The last piece is a session handoff — notes that help you (or me) pick up exactly where you left off next time. It's a small thing that prevents the 'wait, what was I doing?' problem. Want to wrap up this session with handoff notes?"

# Archetype-specific requirements
# /adopt adjusts these based on repo_archetype
# Defaults per archetype:
#   saas                  → min_programs: 3, min_invariants: 3, required_engines: [eng-engine, health-check, financial-audit]
#   frontend              → min_programs: 2, min_invariants: 2, required_engines: [eng-engine, health-check, ux-audit]
#   data-platform         → min_programs: 2, min_invariants: 2, required_engines: [eng-engine, health-check]
#   dev-tool              → min_programs: 1, min_invariants: 1, required_engines: [eng-engine, health-check]
#   research              → min_programs: 1, min_invariants: 1, required_engines: [eng-engine]
#   research-clinical     → min_programs: 3, min_invariants: 4, required_engines: [eng-engine, health-check] — claims-policy mandatory; stricter invariant floor due to evidence requirements
#   research-mathematical → min_programs: 2, min_invariants: 3, required_engines: [eng-engine] — anti-hallucination elevated
#   research-empirical    → min_programs: 2, min_invariants: 2, required_engines: [eng-engine, health-check] — data-provenance mandatory
#   api-service           → min_programs: 2, min_invariants: 2, required_engines: [eng-engine, health-check]
archetype_requirements:
  min_programs: 1
  min_invariants: 1
  required_engines: []     # populated by /adopt based on repo_archetype

